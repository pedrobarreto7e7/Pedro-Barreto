<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meu Site</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #0f0e0d;
      --cream: #f5f0e8;
      --sand: #e8dfc8;
      --rust: #c0533a;
      --rust-light: #e8694f;
      --muted: #6b6560;
      --radius: 2px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--ink);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Loading overlay ── */
    #loading-overlay {
      position: fixed; inset: 0;
      background: var(--cream);
      display: flex; align-items: center; justify-content: center;
      z-index: 999;
      transition: opacity 0.5s ease;
    }
    #loading-overlay.hidden { opacity: 0; pointer-events: none; }
    .loader-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--rust);
      animation: bounce 0.9s ease-in-out infinite;
      margin: 0 4px;
    }
    .loader-dot:nth-child(2) { animation-delay: 0.15s; }
    .loader-dot:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); opacity: 0.4; }
      50% { transform: translateY(-14px); opacity: 1; }
    }

    /* ── Nav ── */
    nav {
      position: fixed; top: 0; width: 100%; z-index: 100;
      padding: 20px 40px;
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(245,240,232,0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--sand);
    }
    .nav-brand {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem; font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--ink);
      text-decoration: none;
    }
    .nav-admin {
      font-size: 0.78rem; font-weight: 500;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      padding: 6px 16px;
      border: 1px solid var(--sand);
      border-radius: 999px;
      transition: all 0.2s;
    }
    .nav-admin:hover { background: var(--ink); color: var(--cream); border-color: var(--ink); }

    /* ── Hero ── */
    .hero {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
      padding-top: 80px;
    }

    .hero-text {
      display: flex; flex-direction: column; justify-content: center;
      padding: 80px 60px 80px 80px;
    }

    .hero-eyebrow {
      font-size: 0.72rem; font-weight: 500;
      letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--rust);
      margin-bottom: 24px;
      display: flex; align-items: center; gap: 12px;
    }
    .hero-eyebrow::before {
      content: ''; display: block;
      width: 32px; height: 1px; background: var(--rust);
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.4rem, 5vw, 4rem);
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 28px;
      color: var(--ink);
    }

    .hero-desc {
      font-size: 1.05rem; font-weight: 300;
      line-height: 1.75; color: var(--muted);
      max-width: 480px;
      margin-bottom: 48px;
    }

    .btn-primary {
      display: inline-flex; align-items: center; gap: 10px;
      background: var(--rust);
      color: #fff;
      font-size: 0.85rem; font-weight: 500;
      letter-spacing: 0.08em; text-transform: uppercase;
      text-decoration: none;
      padding: 16px 32px;
      border-radius: var(--radius);
      transition: background 0.2s, transform 0.15s;
      border: none; cursor: pointer;
    }
    .btn-primary:hover { background: var(--rust-light); transform: translateY(-2px); }
    .btn-primary svg { transition: transform 0.2s; }
    .btn-primary:hover svg { transform: translateX(4px); }

    .hero-image-wrap {
      position: relative;
      overflow: hidden;
      background: var(--sand);
    }

    #site-image {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.6s ease;
    }

    .hero-image-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(192,83,58,0.12) 0%, transparent 60%);
      pointer-events: none;
    }

    /* ── Sections ── */
    .section {
      padding: 100px 80px;
      border-top: 1px solid var(--sand);
    }
    .section-label {
      font-size: 0.7rem; font-weight: 500;
      letter-spacing: 0.25em; text-transform: uppercase;
      color: var(--rust); margin-bottom: 48px;
    }

    /* Services */
    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 2px;
    }
    .service-card {
      padding: 40px 32px;
      background: var(--sand);
      transition: background 0.2s;
    }
    .service-card:hover { background: var(--ink); color: var(--cream); }
    .service-card h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem; margin-bottom: 12px;
    }
    .service-card p { font-size: 0.88rem; line-height: 1.65; opacity: 0.7; }

    /* Plans */
    .plans-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 24px;
    }
    .plan-card {
      padding: 40px 32px;
      border: 1px solid var(--sand);
      border-radius: var(--radius);
      position: relative;
    }
    .plan-card.featured {
      background: var(--ink); color: var(--cream);
      border-color: var(--ink);
    }
    .plan-card.featured .plan-badge {
      display: block;
    }
    .plan-badge {
      display: none;
      position: absolute; top: -12px; left: 32px;
      font-size: 0.65rem; font-weight: 600;
      letter-spacing: 0.15em; text-transform: uppercase;
      background: var(--rust); color: #fff;
      padding: 4px 12px; border-radius: 999px;
    }
    .plan-name {
      font-size: 0.78rem; font-weight: 500;
      letter-spacing: 0.15em; text-transform: uppercase;
      margin-bottom: 16px; opacity: 0.6;
    }
    .plan-price {
      font-family: 'Playfair Display', serif;
      font-size: 2.8rem; font-weight: 900;
      line-height: 1; margin-bottom: 8px;
    }
    .plan-period { font-size: 0.8rem; opacity: 0.5; margin-bottom: 28px; }
    .plan-features { list-style: none; }
    .plan-features li {
      font-size: 0.88rem; padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex; align-items: center; gap: 8px;
    }
    .plan-card:not(.featured) .plan-features li { border-color: var(--sand); }
    .plan-features li::before { content: '✓'; color: var(--rust); font-weight: 700; }
    .plan-card.featured .plan-features li::before { color: var(--rust-light); }

    /* WhatsApp float */
    #whatsapp-btn {
      position: fixed; bottom: 32px; right: 32px; z-index: 200;
      width: 56px; height: 56px;
      background: #25d366;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    #whatsapp-btn:hover { transform: scale(1.1); box-shadow: 0 8px 28px rgba(0,0,0,0.25); }
    #whatsapp-btn svg { width: 28px; height: 28px; fill: #fff; }

    /* Footer */
    footer {
      padding: 40px 80px;
      border-top: 1px solid var(--sand);
      display: flex; align-items: center; justify-content: space-between;
      font-size: 0.8rem; color: var(--muted);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .hero { grid-template-columns: 1fr; }
      .hero-text { padding: 60px 32px 40px; }
      .hero-image-wrap { height: 320px; }
      .section { padding: 60px 32px; }
      footer { flex-direction: column; gap: 12px; text-align: center; padding: 32px; }
      nav { padding: 16px 24px; }
    }
  </style>
</head>
<body>

<!-- Loading -->
<div id="loading-overlay">
  <div style="display:flex">
    <div class="loader-dot"></div>
    <div class="loader-dot"></div>
    <div class="loader-dot"></div>
  </div>
</div>

<!-- Nav -->
<nav>
  <a href="/" class="nav-brand" id="nav-brand">Meu Site</a>
  <a href="/admin/" class="nav-admin">⚙ Admin</a>
</nav>

<!-- Hero -->
<section class="hero">
  <div class="hero-text">
    <span class="hero-eyebrow">Bem-vindo</span>
    <h1 id="site-titulo">Carregando...</h1>
    <p class="hero-desc" id="site-descricao">Aguarde enquanto carregamos o conteúdo.</p>
    <a href="#servicos" class="btn-primary">
      Ver serviços
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </a>
  </div>
  <div class="hero-image-wrap">
    <img id="site-image" src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=900&q=80" alt="Hero image" />
    <div class="hero-image-overlay"></div>
  </div>
</section>

<!-- Serviços -->
<section class="section" id="servicos">
  <div class="section-label">O que oferecemos</div>
  <div class="services-grid" id="services-grid">
    <!-- populated by JS -->
  </div>
</section>

<!-- Planos -->
<section class="section" id="planos" style="background: var(--sand)">
  <div class="section-label">Planos & Preços</div>
  <div class="plans-grid" id="plans-grid">
    <!-- populated by JS -->
  </div>
</section>

<!-- Footer -->
<footer>
  <span id="nav-brand-footer">© 2025 Meu Site</span>
  <span>Conteúdo gerenciado via CMS</span>
</footer>

<!-- WhatsApp -->
<a id="whatsapp-btn" href="#" target="_blank" title="Falar no WhatsApp">
  <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
  </svg>
</a>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

  // ⚠️ SUBSTITUA com suas credenciais do Firebase
 const firebaseConfig = {
  apiKey: "AIzaSyBr9ZeVq2aJAWxgxVX9f2YAmTDIH7Apmno",
  authDomain: "admin-22bf7.firebaseapp.com",
  projectId: "admin-22bf7",
  storageBucket: "admin-22bf7.firebasestorage.app",
  messagingSenderId: "78407247770",
  appId: "1:78407247770:web:7c779e4d1bdf1428177c23",
  measurementId: "G-2MGJ846QY1"
};

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  async function loadContent() {
    try {
      const docRef = doc(db, 'site', 'conteudo');
      const snap = await getDoc(docRef);

      if (snap.exists()) {
        const data = snap.data();

        // Título
        if (data.titulo) {
          document.getElementById('site-titulo').textContent = data.titulo;
          document.querySelector('.nav-brand').textContent = data.titulo;
          document.getElementById('nav-brand-footer').textContent = `© 2025 ${data.titulo}`;
          document.title = data.titulo;
        }

        // Descrição
        if (data.descricao) {
          document.getElementById('site-descricao').textContent = data.descricao;
        }

        // Imagem
        if (data.imagem) {
          document.getElementById('site-image').src = data.imagem;
        }

        // WhatsApp
        if (data.whatsapp) {
          const number = data.whatsapp.replace(/\D/g, '');
          document.getElementById('whatsapp-btn').href = `https://wa.me/${number}`;
        }

        // Serviços
        if (data.servicos && Array.isArray(data.servicos)) {
          const grid = document.getElementById('services-grid');
          grid.innerHTML = data.servicos.map(s => `
            <div class="service-card">
              <h3>${s.nome}</h3>
              <p>${s.descricao}</p>
            </div>
          `).join('');
        }

        // Planos
        if (data.planos && Array.isArray(data.planos)) {
          const grid = document.getElementById('plans-grid');
          grid.innerHTML = data.planos.map((p, i) => `
            <div class="plan-card ${p.destaque ? 'featured' : ''}">
              <span class="plan-badge">Mais popular</span>
              <div class="plan-name">${p.nome}</div>
              <div class="plan-price">R$ ${p.preco}</div>
              <div class="plan-period">/mês</div>
              <ul class="plan-features">
                ${(p.features || []).map(f => `<li>${f}</li>`).join('')}
              </ul>
            </div>
          `).join('');
        }
      }
    } catch (err) {
      console.warn('Firebase não configurado ou erro ao carregar:', err);
      // Conteúdo padrão de demonstração
      document.getElementById('site-titulo').textContent = 'Seu Negócio Aqui';
      document.getElementById('site-descricao').textContent = 'Configure o Firebase e acesse o painel /admin para editar todo o conteúdo do site sem precisar alterar o código.';
      renderDefaultServices();
      renderDefaultPlans();
    } finally {
      // Remove loading
      setTimeout(() => {
        document.getElementById('loading-overlay').classList.add('hidden');
      }, 400);
    }
  }

  function renderDefaultServices() {
    const grid = document.getElementById('services-grid');
    const services = [
      { nome: 'Design', descricao: 'Criação de identidades visuais únicas e memoráveis.' },
      { nome: 'Desenvolvimento', descricao: 'Sites e sistemas sob medida para o seu negócio.' },
      { nome: 'Marketing', descricao: 'Estratégias digitais que geram resultados reais.' },
      { nome: 'Consultoria', descricao: 'Orientação especializada para crescer com segurança.' },
    ];
    grid.innerHTML = services.map(s => `
      <div class="service-card"><h3>${s.nome}</h3><p>${s.descricao}</p></div>
    `).join('');
  }

  function renderDefaultPlans() {
    const grid = document.getElementById('plans-grid');
    const plans = [
      { nome: 'Básico', preco: '97', destaque: false, features: ['1 site', '5 páginas', 'Suporte email'] },
      { nome: 'Profissional', preco: '197', destaque: true, features: ['3 sites', 'Ilimitado', 'Suporte prioritário', 'CMS incluso'] },
      { nome: 'Enterprise', preco: '497', destaque: false, features: ['Ilimitado', 'SLA garantido', 'Suporte 24/7', 'Servidor dedicado'] },
    ];
    grid.innerHTML = plans.map(p => `
      <div class="plan-card ${p.destaque ? 'featured' : ''}">
        <span class="plan-badge">Mais popular</span>
        <div class="plan-name">${p.nome}</div>
        <div class="plan-price">R$ ${p.preco}</div>
        <div class="plan-period">/mês</div>
        <ul class="plan-features">
          ${p.features.map(f => `<li>${f}</li>`).join('')}
        </ul>
      </div>
    `).join('');
  }

  loadContent();
</script>

</body>
</html>
